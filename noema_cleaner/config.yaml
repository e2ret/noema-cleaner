name: NOEMA Cleaner
version: "0.4.1"
slug: noema_cleaner
description: Находит и удаляет кэши сборок, старые версии и временные файлы
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:broom
panel_title: Cleaner
docker_api: true
hassio_api: true
hassio_role: manager
homeassistant_api: true
services:
  - mqtt:want
map:
  - type: homeassistant_config
    read_only: false
    path: /config
options:
  auto_clean: false
  interval_hours: 168
  log_max_age_days: 7
  keep_esphome_versions: 1
  mqtt: true
  scan_interval_minutes: 60
schema:
  auto_clean: bool
  interval_hours: int(1,)
  log_max_age_days: int(1,)
  keep_esphome_versions: int(1,)
  mqtt: bool
  scan_interval_minutes: int(5,)
